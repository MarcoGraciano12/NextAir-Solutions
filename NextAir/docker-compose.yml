services:
  # PostgreSQL database service
  database:

    image: postgres:17-alpine

    # Environment variables for database configuration
    environment:
      POSTGRES_USER: ${DB_USER}        # Database username from system env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Database password from system env
      POSTGRES_DB: ${DB_NAME}          # Database name from system env

    # Expose PostgreSQL port
    ports:
      - "5432:5432"

    # Mount volume for data persistence
    volumes:
      - nextair_db:/var/lib/postgresql/data

  backend:

    # Build from Backend directory Dockerfile
    build: ./Backend

    # Load environment variables from .env file
    env_file:
      - .env
    environment:
      # Database variables
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: database
      DB_PORT: 5432

      # Logging variables
      LOG_LEVEL: DEBUG
      LOG_BACKUP_COUNT: 30

      # Set timezone
      TZ: America/Mexico_City

    volumes:
      - ./Backend:/app
      - ./logs:/logs

    # Expose Flask development server on port 5000
    ports:
      - "5000:5000"

    # Wait for database container to start
    depends_on:
      - database

# Named volume for database data
volumes:
  nextair_db:
